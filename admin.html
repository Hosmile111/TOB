<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>后台 · 非车险产品浏览目录</title>
<link rel="preconnect" href="https://hrwezjngocxtlfsprmwk.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://hosmile111.github.io">
<style>
:root{--bg:#f3f5f8;--line:#e2e7ee;--txt:#1b2430;--muted:#6b7a8d;--brand:#1d4d8a}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
button,input,textarea{font-family:inherit}

/* 登录 */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(16,32,64,.12);padding:32px;width:min(380px,94vw)}
.login-box h2{margin:0 0 6px;font-size:20px;text-align:center}
.login-box .sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:22px}
.login-box label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
.login-box input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;margin-bottom:14px}
.login-box input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.btn{width:100%;background:var(--brand);color:#fff;border:0;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{background:#0f3a72}
.login-err{background:#fdecec;color:#b91c1c;font-size:12.5px;padding:9px 12px;border-radius:7px;margin-bottom:14px;display:none}

/* 顶栏 */
.topbar{background:#1d4d8a;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.topbar h1{margin:0;font-size:17px;font-weight:700}
.topbar .spacer{flex:1}
.topbar button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);padding:7px 14px;border-radius:7px;font-size:13px;cursor:pointer}
.topbar button:hover{background:rgba(255,255,255,.26)}
.topbar button.primary{background:#fff;color:#1d4d8a;font-weight:700;border-color:#fff}
.topbar button.primary:hover{background:#eaf0ff}
.dirty{font-size:12px;color:#ffd7a8}

/* 主体 */
.main{display:flex;gap:0;min-height:calc(100vh - 56px);align-items:flex-start}
.side{width:210px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:14px 0;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow:auto}
.side .st{font-size:11px;color:#93a1b3;padding:0 16px 8px;font-weight:600;letter-spacing:.5px}
.side a{display:flex;align-items:center;gap:8px;padding:9px 16px;color:#3d4b5e;text-decoration:none;font-size:13.5px;cursor:pointer;border-left:3px solid transparent}
.side a:hover{background:#f6f8fb}
.side a.on{background:#eaf0ff;color:#1d4d8a;font-weight:700;border-left-color:#1d4d8a}
.side a .n{margin-left:auto;font-size:11px;color:#93a1b3;background:#f1f4f9;padding:1px 7px;border-radius:10px}
.content{flex:1;padding:20px;min-width:0}

/* 产品编辑卡 */
.pcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,32,64,.04)}
.pcard .hd{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.pcard .hd .idx{background:#1d4d8a;color:#fff;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.pcard .hd .t{font-weight:700;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .hd button{background:#fff;border:1px solid var(--line);color:var(--muted);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.pcard .hd button:hover{border-color:#1d4d8a;color:#1d4d8a}
.pcard .hd button.del:hover{border-color:#b82020;color:#b82020}

.pbody{display:flex;gap:16px;flex-wrap:wrap}
.imgbox{flex-shrink:0;width:190px}
.imgbox .prev{width:190px;height:142px;border:1.5px dashed #cdd6e2;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#aab4c4;font-size:12px;cursor:pointer;overflow:hidden;background:#fafbfd;flex-direction:column;gap:4px}
.imgbox .prev img{width:100%;height:100%;object-fit:contain}
.imgbox .prev .ic{font-size:26px;opacity:.6}
.imgbox .ops{display:flex;gap:6px;margin-top:7px}
.imgbox .ops button{flex:1;border:1px solid var(--line);background:#fff;padding:5px;border-radius:6px;font-size:12px;color:var(--muted);cursor:pointer}
.imgbox .ops button:hover{border-color:#1d4d8a;color:#1d4d8a}
.imgbox .ops button.rm:hover{border-color:#b82020;color:#b82020}

.fields{flex:1;min-width:260px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.fields{grid-template-columns:1fr}}
.fields .f{display:flex;flex-direction:column}
.fields .f.full{grid-column:1/-1}
.fields label{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.fields input,.fields textarea{border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:13px;outline:none;width:100%;resize:vertical}
.fields input:focus,.fields textarea:focus{border-color:#1d4d8a;box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.fields textarea{min-height:62px}
.fields .f.fee3{grid-column:1/-1}
.fields .f.fee3 .fee3-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fields .f.fee3 .fee3-row input{flex:1;min-width:110px;font-size:12.5px}

.addbtn{width:100%;border:1.5px dashed #cdd6e2;background:#fff;color:var(--muted);padding:13px;border-radius:10px;font-size:13.5px;cursor:pointer;margin-bottom:20px}
.addbtn:hover{border-color:#1d4d8a;color:#1d4d8a;background:#f6f9ff}

.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(20,30,45,.93);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:#b82020}
.toast.ok{background:#0f7b4f}

.hint{background:#eaf0ff;border:1px solid #cddcf7;border-radius:9px;padding:12px 15px;margin-bottom:18px;font-size:12.5px;color:#2a4f76;line-height:1.75}
.hint b{color:#1d4d8a}
.warn{background:#fff8ec;border:1px solid #f0d9b0;color:#7a5a1a}

/* GitHub 发布弹窗 */
.modal{position:fixed;inset:0;background:rgba(15,25,40,.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:18px}
.modal-box{background:#fff;border-radius:14px;padding:24px;width:min(460px,95vw);box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal-box h3{margin:0 0 6px;font-size:18px}
.modal-box .m-sub{font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.7}
.modal-box .m-sub code{background:#eef2f8;padding:1px 6px;border-radius:4px;font-size:12px}
.modal-box label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 5px}
.modal-box input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;outline:none}
.modal-box input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.modal-box .m-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.modal-box .m-actions button{flex:1;min-width:120px;border:1px solid var(--line);background:#fff;padding:10px;border-radius:8px;font-size:13px;cursor:pointer}
.modal-box .m-actions button.primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.modal-box .m-actions button.primary:hover{background:#0f3a72}
.modal-box .m-actions button.ghost:hover{border-color:var(--brand);color:var(--brand)}
.modal-box .m-status{margin-top:12px;font-size:12.5px;line-height:1.6;min-height:18px}
.modal-box .m-status.ok{color:#0f7b4f}
.modal-box .m-status.err{color:#b82020}
.modal-box .m-status.ing{color:var(--brand)}
.prow{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.prow input{width:auto;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:13px;outline:none}
.prow input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.prow .pcode{width:106px;font-weight:700;letter-spacing:2px;text-align:center;background:#f6f8fb}
.prow .plabel{flex:1;min-width:130px}
.prow button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer}
.prow button.on{border-color:#0f7b4f;color:#0f7b4f;font-weight:600}
.prow button.off{border-color:#b82020;color:#b82020;font-weight:600}
.prow button.del:hover{border-color:#b82020;color:#b82020}

/* 投保链接编辑块（紧凑） */
.insure-block{grid-column:1/-1;border:1px dashed #cfd9e6;background:#f7faff;border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:1fr 88px;gap:8px;align-items:start}
.insure-block .insure-text{display:flex;flex-direction:column;gap:3px}
.insure-block .insure-text label{margin:0!important;font-size:11.5px;color:#5b6a82;font-weight:500}
.insure-block .insure-text input{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;outline:none}
.insure-block .insure-text input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.insure-block .qr-cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.insure-block .qr-cell .prev-qr{width:78px;height:78px;border:1px solid var(--line);border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.insure-block .qr-cell .prev-qr img{width:100%;height:100%;object-fit:contain}
.insure-block .qr-cell .prev-qr .placeholder{font-size:10.5px;color:#9aa7b8;text-align:center;padding:4px;line-height:1.35}
.insure-block .qr-cell .ops{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.insure-block .qr-cell .ops button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;color:#5b6a82}
.insure-block .qr-cell .ops button:hover{border-color:var(--brand);color:var(--brand)}
.insure-block .qr-cell .ops button.rm:hover{border-color:#b82020;color:#b82020}
@media(max-width:760px){.insure-block{grid-template-columns:1fr}}

/* 手机端后台优化 */
@media(max-width:760px){
  .main{flex-direction:column}
  .side{width:100%;position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);
        display:flex;overflow-x:auto;padding:6px 0;gap:2px}
  .side .st{display:none}
  .side a{flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;padding:8px 14px;white-space:nowrap}
  .side a.on{border-left:0;border-bottom-color:#1d4d8a;background:transparent}
  .content{padding:12px}
  .topbar{padding:10px 12px;gap:6px}
  .topbar h1{font-size:15px;width:100%}
  .topbar .spacer{display:none}
  .topbar button{padding:6px 10px;font-size:12px}
  .pcard{padding:12px}
  .pbody{gap:12px}
  .imgbox{width:100%}
  .imgbox .prev{width:100%;height:auto;aspect-ratio:4/3}
  .fields{grid-template-columns:1fr}
  .modal-box{padding:18px}
  .prow{gap:5px}
  .prow .pcode{width:92px}
  .prow .plabel{min-width:100px}
  .dirty{font-size:11px}
}
</style>
</head>
<body>

<div id="loginView" class="login-wrap" style="display:none">
  <div class="login-box">
    <h2>非车险产品目录</h2>
    <div class="sub">后台管理 · 请登录</div>
    <div class="login-err" id="loginErr"></div>
    <label>管理员账号</label>
    <input type="text" id="lu" autocomplete="username" placeholder="请输入管理员账号">
    <label>密码</label>
    <input type="password" id="lp" autocomplete="current-password" placeholder="请输入密码">
    <button class="btn" id="loginBtn">登 录</button>
  </div>
</div>

<div id="adminView" style="display:none">
  <div class="topbar">
    <h1>⚙ 产品后台管理</h1>
    <span class="dirty" id="dirtyTip"></span>
    <span class="dirty" id="sizeTip"></span>
    <span class="spacer"></span>
    <button id="reloadBtn">🔄 恢复云端版本</button>
    <button id="saveBtn">💾 保存并同步</button>
    <button id="pwdBtn">🔑 修改密码</button>
    <button id="exportSingleBtn">📦 导出单文件版</button>
    <button id="passBtn">🔑 查看密码</button>
    <button id="logoutBtn">退出</button>
  </div>
  <div class="main">
    <nav class="side" id="side"><div class="st">产品分类</div></nav>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="passModal" class="modal" style="display:none">
  <div class="modal-box">
    <h3>🔑 手续费查看密码</h3>
    <p class="m-sub">点「＋ 生成新密码」自动生成 5-6 位数字，<b>也可直接在密码框里改成自定义数字</b>；对方在前台滑动开关输入即可查看对应费率的<b>那一条手续费</b>（不会看到其他）。<br>设置对应人群：
      <b>业务员</b>密码 → 只看业务员费率 / <b>客户</b>密码 → 只看客户费率 / <b>渠道</b>密码 → 只看渠道费率 / <b>全部</b>密码 → 三条都看（管理员校验用）。<br>
      后台录入「渠道费用」时，业务员会自动=渠道-5、客户自动=业务员-3；这两项也可自由修改。<br>
      最多 10 组；把某组设为「失效」后，用过它的人刷新页面会自动重新锁定。</p>
    <div id="passList"></div>
    <div class="m-actions">
      <button id="passGen" class="primary">＋ 生成新密码</button>
      <button id="passClose" class="ghost">完成</button>
    </div>
    <div id="passStatus" class="m-status"></div>
  </div>
</div>

<script src="./supabase-config.js"></script>
<script>
/* ================= 状态 ================= */
const LS_WORK = 'fxy_admin_work';
const LS_PW   = 'fxy_admin_pwhash';
const DEFAULT_PW = 'admin888';

let DB = { categories: [] };
let cur = '';
let dirty = false;

const $ = s => document.querySelector(s);
function esc(s){const M={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'};
  return String(s==null?'':s).replace(/[&<>"]/g,c=>M[c]);}
function toast(msg, kind){
  const t=$('#toast'); t.textContent=msg; t.className='toast show'+(kind?' '+kind:'');
  clearTimeout(toast._t); toast._t=setTimeout(()=>{t.className='toast';},2600);
}
function markDirty(){ dirty=true; $('#dirtyTip').textContent='● 修改中…'; updateSizeTip(); scheduleSave(); }
/* 数据体积提示：内嵌图片会让 catalog.json 膨胀 → 前台加载变慢甚至打不开。
   超过 300KB 就标红，提示把图片换小或改用文件方式。 */
function dataSizeKB(){
  try{ return Math.round(JSON.stringify(DB).length/1024); }catch(e){ return 0; }
}
function updateSizeTip(){
  const el=$('#sizeTip'); if(!el) return;
  const kb=dataSizeKB();
  el.textContent='· 数据 '+kb+' KB';
  if(kb>600){ el.textContent='· 数据 '+kb+' KB（过大！会拖慢前台，请把图片压小）'; el.style.color='#ffb3b3'; }
  else if(kb>300){ el.textContent='· 数据 '+kb+' KB（偏大，建议图片压小）'; el.style.color='#ffe0a8'; }
  else { el.style.color='#bfe3c8'; }
}
let saveTimer, syncTimer;
const LS_WORK_TS = 'fxy_admin_work_ts';
function saveWorkDraft(){
  try{ localStorage.setItem(LS_WORK, JSON.stringify(DB)); localStorage.setItem(LS_WORK_TS, String(Date.now())); }catch(e){}
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveWorkDraft, 400);
  scheduleAutoSync();
}
/* 实时同步：停止修改约 5 秒后自动推送到 Supabase，前台刷新即可看到，无需手动点发布 */
let _syncRetry = 0;
function scheduleAutoSync(){
  clearTimeout(syncTimer);
  syncTimer=setTimeout(async ()=>{
    const tip=$('#dirtyTip');
    try{
      if(tip) tip.textContent='● 正在同步到线上…';
      await pushToSupabase();
      _syncRetry = 0;
      if(tip) tip.textContent='● 已同步 · 前台刷新即可看到';
    }catch(e){
      if(_syncRetry < 5){
        _syncRetry++;
        if(tip) tip.textContent='● 已存本机（同步失败，15 秒后自动重试 '+_syncRetry+'/5）';
        syncTimer=setTimeout(scheduleAutoSync, 15000);
      }else{
        if(tip) tip.textContent='● 已存本机（多次同步失败，请点「💾 保存并同步」重试）';
      }
    }
  },5000);
}

/* ================= 密码 ================= */
async function sha256(s){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function ensureDefaultPw(){
  if(!localStorage.getItem(LS_PW)){
    localStorage.setItem(LS_PW, await sha256(DEFAULT_PW));
  }
}
function getPwHash(){ return localStorage.getItem(LS_PW) || ''; }

function showLogin(){ $('#loginView').style.display='flex'; $('#adminView').style.display='none'; }
function showAdmin(){ $('#loginView').style.display='none'; $('#adminView').style.display='block'; }

async function doLogin(){
  const u=$('#lu').value.trim(), p=$('#lp').value;
  $('#loginErr').style.display='none';
  if(u!=='seeyoulook@qq.com'){ $('#loginErr').textContent='账号错误'; $('#loginErr').style.display='block'; return; }
  if(!p){ $('#loginErr').textContent='请输入密码'; $('#loginErr').style.display='block'; return; }
  const btn=$('#loginBtn'); btn.disabled=true; btn.textContent='登录中…';
  try{
    await ensureDefaultPw();
    const h=await sha256(p);
    const localOK = (h===getPwHash());

    if(localOK){
      // 路径 A：本机 hash 一致，秒进（除非还没缓存就需要先加载数据，最多 2.5s）
      const cached = readACache();
      if(!cached){
        btn.textContent='载入数据…';
        await loadBaseData();
      }
      if(!(DB && (DB.categories||[]).length)){
        // 仍未拿到，去 fetch（兜底）
        await loadBaseData();
      }
      btn.textContent='登录成功';
      await initAdmin();
      // 后台异步校验线上 hash（不阻塞登录）
      // 策略：以本机为源头（用户在本机就是权威）。如果本机与线上不一致，把本机推到线上，
      //       而不是反向覆盖本机——否则「修改了新密码」永远无法同步到所有设备
      setTimeout(async()=>{
        try{
          const sb = await sbLoad();
          if(sb && sb.adminPassHash && h !== sb.adminPassHash){
            try{
              DB.adminPassHash = h;
              await pushToSupabase();
              toast('⚠ 本机新密码还没同步到线上，已自动推回','ok');
            }catch(e2){
              toast('⚠ 本机新密码未同步到线上：'+e2.message+'，请点「💾 保存并同步」','err');
            }
          }
        }catch(e){}
      }, 200);
      return;
    }
    // 路径 B：本机不匹配，需校验线上
    btn.textContent='正在校验线上密码…';
    await loadBaseData();
    const online=(DB.adminPassHash||'');
    if(!online || h !== online) throw new Error('密码错误');
    // 同步到本机
    localStorage.setItem(LS_PW, online);
    btn.textContent='登录成功';
    await initAdmin();
  }catch(e){
    $('#loginErr').textContent=e.message; $('#loginErr').style.display='block';
  }finally{ btn.disabled=false; btn.textContent='登 录'; }
}

/* ================= 载入数据 ================= */
/* 数据加载：admin 端 localStorage 10 分钟缓存 + supabase/catalog 并发，2s 超时 */
const A_CACHE_KEY='fxy_admin_cat_cache', A_CACHE_TTL=10*60*1000;
function readACache(){
  try{
    const o=JSON.parse(localStorage.getItem(A_CACHE_KEY)||'{}');
    if(o && o._ts && Date.now()-o._ts < A_CACHE_TTL && o.data && (o.data.categories||[]).length) return o.data;
  }catch(e){}
  return null;
}
function writeACache(data){
  try{ localStorage.setItem(A_CACHE_KEY, JSON.stringify({_ts:Date.now(), data})); }catch(e){}
}
async function loadBaseData(){
  const cached = readACache();
  if(cached){ DB = cached; return DB; }
  // 并发 supabase + catalog.json
  let resolved=false;
  const tryUse=(d)=>{
    if(resolved) return;
    if(!d || !(d.categories||[]).length) return;
    resolved=true;
    DB=d; writeACache(d);
  };
  sbLoad().then(tryUse).catch(()=>{});
  fetch('./catalog.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(tryUse).catch(()=>{});
  // 等到第一个结果，最多等 2.5s（admin 比 index 更宽松一点点，给 SB 一点时间）
  const start=Date.now();
  while(!resolved && Date.now()-start<2500){
    await new Promise(r=>setTimeout(r, 60));
  }
  return DB;
}
async function initAdmin(){
  if(!(DB.categories||[]).length){
    const cached=readACache();
    if(cached){ DB=cached; }
    if(!(DB && (DB.categories||[]).length)){ await loadBaseData(); }
  }
  const saved = localStorage.getItem(LS_WORK);
  if(saved){
    try{
      const local = JSON.parse(saved);
      if(local && (local.categories||[]).length){
        // 只有本机草稿比线上数据更新时才恢复——防止旧草稿覆盖线上新修改（内容丢失的根源）
        let localTs=0; try{ localTs=parseInt(localStorage.getItem(LS_WORK_TS)||'0',10)||0; }catch(e){}
        let sbTs=0;    try{ sbTs=DB.updatedAt?new Date(DB.updatedAt).getTime():0; }catch(e){}
        if(!sbTs || localTs>sbTs){
          DB = local;
          toast('已恢复本机未同步的修改，正在推送到线上…','ok');
          scheduleAutoSync();
        }else{
          // 线上是更新的版本：丢弃本机旧草稿，避免覆盖丢数据
          localStorage.removeItem(LS_WORK);
          localStorage.removeItem(LS_WORK_TS);
        }
      }
    }catch(e){}
  }
  if(!DB || !(DB.categories||[]).length) DB = {categories:[]};
  showAdmin();
  cur = DB.categories[0] ? DB.categories[0].id : '';

  dirty=false; $('#dirtyTip').textContent='';

// 工具：解析数字 / 判断带 % / 格式化 / 夹到最小 1 / 设置值（带 input 事件传播）
function _feeNum(s){const m=String(s==null?'':s).match(/(-?\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):null}
function _feePct(el){return /%/.test(String(el&&el.value||''))}
function _feeFmt(x,usePct){return usePct?(x+'%'):String(x)}
function _feeClamp(x){return Math.max(1,+(+x).toFixed(2))}
function _feeSet(el,v){if(!el)return;el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}))}
// 渠道费用改动 → 业务员=渠道-5（最低1）、客户=业务员-3（最低1）
function fillFromChannel(input){
  const ch=_feeNum(input.value);if(ch==null)return;
  const key=input.dataset.key,card=input.closest('.pcard');if(!card)return;
  const a=card.querySelector('input[data-f="feeAgent"][data-key="'+key+'"]');
  const c=card.querySelector('input[data-f="feeClient"][data-key="'+key+'"]');
  const usePct=_feePct(input);
  const agent=_feeClamp(ch-5),client=_feeClamp(agent-3);
  _feeSet(a,_feeFmt(agent,usePct));_feeSet(c,_feeFmt(client,usePct));
}
// 业务员/客户失焦若为空 → 按规则回填（避免费率为空）
function refillOnEmpty(input){
  if((input.dataset.f!=='feeAgent'&&input.dataset.f!=='feeClient')||String(input.value).trim()!=='')return;
  const key=input.dataset.key,card=input.closest('.pcard');if(!card)return;
  const chEl=card.querySelector('input[data-f="feeChannel"][data-key="'+key+'"]');
  const aEl =card.querySelector('input[data-f="feeAgent"][data-key="'+key+'"]');
  const cEl =card.querySelector('input[data-f="feeClient"][data-key="'+key+'"]');
  if(input.dataset.f==='feeAgent'){
    const ch=_feeNum(chEl&&chEl.value);if(ch==null)return;
    const agent=_feeClamp(ch-5),client=_feeClamp(agent-3);
    _feeSet(input,_feeFmt(agent,_feePct(chEl)));
    _feeSet(cEl,_feeFmt(client,_feePct(chEl)));
  }else{
    let agent=_feeNum(aEl&&aEl.value);
    if(agent==null){
      const ch=_feeNum(chEl&&chEl.value);if(ch==null)return;
      agent=_feeClamp(ch-5);_feeSet(aEl,_feeFmt(agent,_feePct(chEl)));
    }else{ agent=_feeClamp(agent); }
    _feeSet(input,_feeFmt(_feeClamp(agent-3),_feePct(chEl)||_feePct(aEl)));
  }
}
// 任何手续费字段若为负数 → 自动夹到 1
function clampNegative(input){
  if(input.dataset.f!=='feeChannel'&&input.dataset.f!=='feeAgent'&&input.dataset.f!=='feeClient')return;
  const v=_feeNum(input.value);
  if(v!=null&&v<1)_feeSet(input,_feeFmt(_feeClamp(v),_feePct(input)));
}

let pickKey=null;
const fileInput=document.createElement('input');

document.body.appendChild(fileInput);

    const b64 = await compress(f);
    const [cid,i]=pickKey.split('|');
    const c=DB.categories.find(x=>x.id===cid);
    if(c && c.products[+i]){ c.products[+i].image=b64; markDirty(); renderSide(); renderContent(); }

  }catch(err){ toast('上传失败：'+err.message,'err'); }

/* 产品图上传：清晰优先——长边 1100px / 质量 0.80
   前台卡片最大显示 380px 高，1100px 约是 3 倍，文字清晰；同时体积可控。
   不要低于 900px / 0.75，否则截图里的小字会糊。 */
function compress(file, maxSide=1100, quality=0.80){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(Math.max(w,h)>maxSide){
          if(w>=h){ h=Math.round(h*maxSide/w); w=maxSide; }
          else { w=Math.round(w*maxSide/h); h=maxSide; }
        }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>reject(new Error('图片读取失败'));
      img.src=fr.result;
    };
    fr.onerror=()=>reject(new Error('文件读取失败'));
    fr.readAsDataURL(file);
  });
}

function download(text, name, type){
  const blob=new Blob([text],{type:type||'application/octet-stream'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}

    data.categories.forEach(c=>c.products.forEach(p=>{
      if(p.image && !p.image.startsWith('data:')){
        tasks.push(fetch(p.image).then(r=>r.blob()).then(b=>new Promise(res=>{

    if(!(DB.categories||[]).length) await loadBaseData();
    const online=(DB.adminPassHash||'');
    const oldH=await sha256(oldP);
    if(online ? (oldH!==online) : (oldH!==getPwHash())){ alert('原密码错误'); return; }
    const newHash=await sha256(newP);
    localStorage.setItem(LS_PW, newHash);
    DB.adminPassHash = newHash;
    markDirty();
    try{
      await pushToSupabase();
      dirty=false; $('#dirtyTip').textContent='● 已同步 · 前台刷新即可看到';
      toast('密码已修改，并已同步到线上（所有设备生效）','ok');
    }catch(e2){
      // 失败不阻塞本机修改。让用户点「💾 保存并同步」重试
      toast('密码本机已改，但同步失败：'+e2.message+'。请点「💾 保存并同步」重试','err');
    }
  }catch(e){ alert('修改失败：'+e.message); }
};

/* ================= Supabase 实时同步（自动） ================= */
function sbCfgAdmin(){
  const c=Object.assign({},(window.SUPABASE||{}));
  try{ const ls=JSON.parse(localStorage.getItem('fxy_supabase_cfg')||'{}'); if(ls&&ls.url) Object.assign(c,ls); }catch(e){}
  if(c.url) c.url = String(c.url).replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,'');
  return c;
}
async function sbLoad(){
  const c=sbCfgAdmin();
  if(!c.url||!c.key) return null;
  try{
    const ac=new AbortController(); const tid=setTimeout(()=>ac.abort(), 8000);
    const r=await fetch(c.url.replace(/\/+$/,'')+'/rest/v1/'+(c.table||'catalog')+'?select=data&id=eq.1',
      {headers:{apikey:c.key,Authorization:'Bearer '+c.key}, signal:ac.signal});
    clearTimeout(tid);
    if(!r.ok) return null;
    const j=await r.json();
    return (j&&j[0]&&j[0].data)?j[0].data:null;
  }catch(e){ return null; }
}

/* 直接把当前数据（含密码哈希 / 查看密码）推送到 Supabase，不依赖弹窗输入 */
async function pushToSupabase(){
  const c = sbCfgAdmin();
  if(!c.url || !c.key) throw new Error('未配置 Supabase');
  const r = await fetch(c.url.replace(/\/+$/,'')+'/rest/v1/'+(c.table||'catalog')+'?id=eq.1', {
    method:'PATCH',
    headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify({data:buildData(),updated_at:new Date().toISOString()})
  });
  if(!r.ok){ const t=await r.text(); throw new Error((t||'').slice(0,150)||('HTTP '+r.status)); }
  return true;
}

/* ================= 查看密码管理 ================= */
function ensurePass(){ if(!Array.isArray(DB.viewPasscodes)) DB.viewPasscodes=[]; return DB.viewPasscodes; }
function genPassCode(){
  let s='';
  const len = 5 + Math.floor(Math.random()*2); // 5~6 位
  for(let i=0;i<len;i++) s += String(Math.floor(Math.random()*10));
  return s;
}
function renderPass(){
  const arr = ensurePass();
  const box = $('#passList');
  if(!arr.length){
    box.innerHTML = '<div class="m-status">还没有生成任何密码，点「＋ 生成新密码」创建。</div>';
  }else{
    let h='';
    arr.forEach((x,i)=>{
      const on = (x.enabled !== false);
      const aud = x.audience || 'both';
      h += '<div class="prow">'+
           '<input class="pcode" data-pcode="'+i+'" value="'+esc(x.code)+'" maxlength="10" placeholder="可自定义">'+
           '<input class="plabel" data-pi="'+i+'" placeholder="人群备注（如：中介A组）" value="'+esc(x.label||'')+'">'+
           '<select class="paud" data-paud="'+i+'">'+
             '<option value="both"'+(aud==='both'?' selected':'')+'>全部</option>'+
             '<option value="agent"'+(aud==='agent'?' selected':'')+'>业务员</option>'+
             '<option value="client"'+(aud==='client'?' selected':'')+'>客户</option>'+
             '<option value="channel"'+(aud==='channel'?' selected':'')+'>渠道</option>'+
           '</select>'+
           '<button class="'+(on?'on':'off')+'" data-ptog="'+i+'">'+(on?'有效':'已失效')+'</button>'+
           '<button class="del" data-pdel="'+i+'">删除</button>'+
           '</div>';
    });
    box.innerHTML = h;
  }
  const g=$('#passGen');
  g.disabled = arr.length >= 10;
  g.textContent = arr.length >= 10 ? '已达上限（10 组）' : '＋ 生成新密码';
}
$('#passBtn').onclick=()=>{ ensurePass(); renderPass(); $('#passStatus').textContent=''; $('#passModal').style.display='flex'; };
$('#passClose').onclick=()=>{ $('#passModal').style.display='none'; };
$('#passModal').addEventListener('click',e=>{ if(e.target.id==='passModal') $('#passModal').style.display='none'; });
$('#passGen').onclick=()=>{
  const arr=ensurePass();
  if(arr.length>=10){ toast('最多 10 组密码','err'); return; }
  arr.push({ id:'pc'+Date.now().toString(36), code:genPassCode(), label:'', enabled:true,
             createdAt:new Date().toISOString() });
  markDirty(); renderPass();
  toast('已生成新密码，约 5 秒后自动同步到线上','ok');
};
$('#passList').addEventListener('click',e=>{
  const t=e.target.closest('[data-ptog]');
  if(t){ const i=+t.dataset.ptog; const arr=ensurePass();
    arr[i].enabled = (arr[i].enabled===false); markDirty(); renderPass();
    toast(arr[i].enabled?'该密码已恢复有效':'该密码已失效，对方刷新后自动锁定','ok'); return; }
  const d=e.target.closest('[data-pdel]');
  if(d){ const i=+d.dataset.pdel;
    if(!confirm('删除这组密码？使用过它的人将无法查看手续费。')) return;
    ensurePass().splice(i,1); markDirty(); renderPass(); return; }
});
$('#passList').addEventListener('input',e=>{
  const el=e.target.closest('[data-pi]');
  if(el){ ensurePass()[+el.dataset.pi].label = el.value; markDirty(); return; }
  const pc=e.target.closest('[data-pcode]');
  if(pc){
    // 密码可自定义：只保留数字，实时查重提示
    const digits = pc.value.replace(/\D/g,'');
    if(digits !== pc.value) pc.value = digits;
    const arr = ensurePass(); const i = +pc.dataset.pcode;
    if(arr[i]){
      arr[i].code = digits;
      if(digits && arr.some((x,j)=>j!==i && x.code===digits)){
        pc.style.borderColor='#b82020'; pc.title='该密码与其他组重复';
      }else{
        pc.style.borderColor=''; pc.title='';
      }
      markDirty();
    }
    return;
  }
  const au=e.target.closest('[data-paud]');
  if(au){ ensurePass()[+au.dataset.paud].audience = au.value; markDirty(); return; }
});
$('#passList').addEventListener('change',e=>{
  const au=e.target.closest('[data-paud]');
  if(au){ ensurePass()[+au.dataset.paud].audience = au.value; markDirty(); }
});

/* ================= 启动 ================= */
$('#loginBtn').onclick=doLogin;
$('#lp').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
$('#lu').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#lp').focus(); });
showLogin();
</script>
