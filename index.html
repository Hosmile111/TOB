function fmtTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const p = n => String(n).padStart(2,'0');
  // 只显示「月-日 时:分」（不显示年份，按用户要求）
  return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

let FEE_ON = false;

  try{ localStorage.removeItem('fxy_fee_code'); localStorage.removeItem('fxy_fee_on'); }catch(e){}

clearLegacyFeeStore();
function passcodes(){ return (DB.viewPasscodes||[]).filter(x=>x && x.enabled && (x.codeHash||x.code)); }
function maskRate(s){
  // 遮罩任意位置的「数字%」模式 —— 未授权访客应看不到任何费率数字
  return String(s==null?'':s).replace(/\d+(?:\.\d+)?\s*%/g, '**%');

function F(s){ return FEE_ON ? s : maskRate(s); }
/* 查看密码：支持两种存法
   · codeHash（推荐，数据里不出现明文密码）：salt + '|code|' + 密码 的 SHA-256
   · code（旧数据明文，向后兼容） */
async function sha256hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(str)));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function codeHashOf(code){
  const salt = (DB && DB.feeSalt) || '';
  return await sha256hex(salt + '|code|' + String(code));
}
// 校验密码并返回该组的 audience（'channel'/'agent'/'client'/'both'），无效则 null
async function validCode(code){
  if(!code) return null;
  const list = passcodes();
  const hit = list.find(x => x.code && String(x.code) === String(code));
  if(hit) return hit.audience || 'both';                    // 旧明文数据
  if(!(DB && DB.feeSalt)) return null;
  const h = await codeHashOf(code);
  const m = list.find(x => x.codeHash && x.codeHash === h);
  return m ? (m.audience || 'both') : null;
}

  if(FEE_AUDIENCE==='both' || FEE_AUDIENCE===field) return s;
  return '';
}
async function revalidateFee(){
  // 数据更新后：只校验「本次会话已输入的密码」是否仍有效；不做任何持久化
  if(!FEE_CODE){ FEE_ON = false; FEE_AUDIENCE = 'none'; updateFeeSw(); return; }
  const aud = await validCode(FEE_CODE);
  if(aud){ FEE_ON = true; FEE_AUDIENCE = aud; unlockFee(FEE_CODE).then(()=>render()); }
  else { FEE_CODE = ''; FEE_ON = false; FEE_AUDIENCE = 'none'; FEE_PLAIN = {}; FEE_KEYLIST = null; }
  updateFeeSw();
}

/* ===== 费率加密（可选开关）：数据里存的是密文，只有输入正确密码后才在前台解密显示 =====
   加密方式：AES-GCM，密钥由「密码 + 全局盐 + 费率类型」经 PBKDF2-SHA256(15万次) 派生。
   数据里若没有 feeSalt，说明还没启用加密 → 自动回退用明文字段（向后兼容）。 */
let FEE_KEYLIST = null;      // 本次会话解出的密钥（仅内存，不持久化）
let FEE_PLAIN = {};          // { '<产品id>|<类型>' : 明文 }
const FEE_FIELD = {channel:'feeChannelEnc', agent:'feeAgentEnc', client:'feeClientEnc'};
const FEE_RAW   = {channel:'feeChannel',    agent:'feeAgent',    client:'feeClient'};
function b64bytes(b){ try{ return Uint8Array.from(atob(b), c=>c.charCodeAt(0)); }catch(e){ return null; } }
async function deriveFeeKey(code, type){
  const saltB64 = (DB && DB.feeSalt) || '';
  if(!saltB64) return null;
  const salt = b64bytes(saltB64); if(!salt) return null;
  const extra = new TextEncoder().encode('|' + type);
  const merged = new Uint8Array(salt.length + extra.length);
  merged.set(salt, 0); merged.set(extra, salt.length);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(code)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:merged, iterations:150000, hash:'SHA-256'},
                                 base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function decStr(key, b64){
  try{
    const raw = b64bytes(b64); if(!raw || raw.length < 14) return null;
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:raw.slice(0,12)}, key, raw.slice(12));
    return new TextDecoder().decode(pt);
  }catch(e){ return null; }
}
async function unlockFee(code){
  const aud = await validCode(code);
  if(!aud) return null;
  FEE_KEYLIST = null; FEE_PLAIN = {};
  if(!(DB && DB.feeSalt)) return aud;                 // 还没启用加密 → 直接读明文
  const types = aud==='both' ? ['channel','agent','client'] : [aud];
  const keys = {};
  for(const t of types){ try{ keys[t] = await deriveFeeKey(code, t); }catch(e){} }
  FEE_KEYLIST = keys;
  for(const c of (DB.categories||[])){
    for(const p of (c.products||[])){
      for(const t of types){
        const enc = p[FEE_FIELD[t]];
        if(enc && keys[t]){
          const v = await decStr(keys[t], enc);
          if(v != null) FEE_PLAIN[p.id+'|'+t] = v;
        }
      }
    }
  }
  return aud;
}
function feeVal(p, t){
  const k = p.id+'|'+t;
  if(FEE_PLAIN[k] != null) return FEE_PLAIN[k];
  return p[FEE_RAW[t]];
}
function hardLockFee(){
  // 每次打开平台都从这里开始：锁定，并清掉本机可能残留的密码与已解密的费率
  FEE_CODE = ''; FEE_ON = false; FEE_AUDIENCE = 'none';
  FEE_PLAIN = {}; FEE_KEYLIST = null;
  clearLegacyFeeStore();
  updateFeeSw();
}
function updateFeeSw(){
  const b=document.getElementById('feeSw');
  if(!b) return;
  b.classList.toggle('on', FEE_ON);
  b.setAttribute('aria-pressed', FEE_ON?'true':'false');
  // 按钮仅含 .knob 视觉元件，无文字标签；状态由 .on class + aria-pressed 体现
}
function sbCfg(){
  const c = Object.assign({}, (window.SUPABASE||{}));
  try{ const ls=JSON.parse(localStorage.getItem('fxy_supabase_cfg')||'{}'); if(ls && ls.url) Object.assign(c, ls); }catch(e){}
  if(c.url) c.url = String(c.url).replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,'');
  return c;
}
async function loadSb(){
  const c = sbCfg();
  if(!c.url || !c.key) return null;
  // 8 秒硬超时：Supabase 不可达/极慢时快速失败，不让页面与密码验证一直卡住
  const ac = new AbortController();
  const tm = setTimeout(()=>ac.abort(), 6000);
  try{
    const r = await fetch(c.url.replace(/\/+$/,'')+'/rest/v1/'+(c.table||'catalog')+'?select=data&id=eq.1',
      { headers:{ apikey:c.key, Authorization:'Bearer '+c.key }, signal:ac.signal });
    if(!r.ok) throw new Error('Supabase HTTP '+r.status);
    const j = await r.json();
    return (j && j[0] && j[0].data && (j[0].data.categories||[]).length) ? j[0].data : null;
  }finally{ clearTimeout(tm); }
}
function fetchJsonTimeout(url, ms){
  const ac = new AbortController();
  const tm = setTimeout(()=>ac.abort(), ms);
  return fetch(url, {cache:'no-store', signal:ac.signal})
    .then(r=>r.ok?r.json():null)
    .finally(()=>clearTimeout(tm));
}
/* 数据加载：localStorage 5 分钟缓存 + supabase/catalog 并发（谁先到用谁），8s 兜底超时 */
const CAT_CACHE_KEY='fxy_cat_cache', CAT_CACHE_TTL=1*60*1000;
function readCatCache(){
  try{
    const o = JSON.parse(localStorage.getItem(CAT_CACHE_KEY)||'{}');
    if(o && o._ts && Date.now()-o._ts < CAT_CACHE_TTL && o.data && (o.data.categories||[]).length) return o.data;
  }catch(e){}
  return null;
}
function writeCatCache(data){
  try{ localStorage.setItem(CAT_CACHE_KEY, JSON.stringify({_ts:Date.now(), data})); }catch(e){}
}
function bgRefresh(){
  // 后台静默拉一次 Supabase 最新数据，之后每 30 秒循环一次保持最新
  // 只有在「云端确实比当前版本新」时才替换 + 弹提示（避免内联快照导致每次都弹）
  (async()=>{
    try{
      const next = await loadSb();
      if(next){
        writeCatCache(next);
        const newTs = Date.parse(next.updatedAt||0)||0;
        const curTs = Date.parse((DB&&DB.updatedAt)||0)||0;
        if(JSON.stringify(next) !== JSON.stringify(DB)){
          DB = next; applyDB(); render();
          if(newTs > curTs){
            try{ showUpdateToast('数据已更新 · v' + (next.updatedAt||'').slice(0,16).replace('T',' ')); }catch(e){}
          }
        }
        revalidateFee();  // 数据更新后重校验本次会话的密码（不做持久化）
        render();
      }
    }catch(e){}
    setTimeout(bgRefresh, 30000);
  })();
}
function showUpdateToast(msg){
  let t=document.getElementById('updToast');
  if(!t){ t=document.createElement('div'); t.id='updToast'; t.style.cssText='position:fixed;bottom:18px;right:18px;background:#0f7b4f;color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:998;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;transition:opacity .25s'; document.body.appendChild(t); }
  t.textContent='✓ '+msg;
  t.style.opacity='1';
  clearTimeout(t._h); t._h=setTimeout(()=>{ t.style.opacity='0'; }, 2500);
}
function showLoadTimeout(){
  document.getElementById('app').innerHTML =
    '<div class="err">数据加载超时：云端数据源与本地 catalog.json 都不可达<br><br>'+
    '请检查网络后点下面的按钮重试。'+
    '<div style="margin-top:12px"><button id="retryLoad" style="padding:9px 22px;border:1px solid #b82020;background:#fff;color:#b82020;border-radius:8px;font-size:13.5px;cursor:pointer">重新加载</button></div></div>';
  const rb=document.getElementById('retryLoad');
  if(rb) rb.onclick=()=>{ try{ localStorage.removeItem(CAT_CACHE_KEY); }catch(e){} location.reload(); };
}
async function load(){
  // 0) 零请求启动：在内联快照与本地缓存里挑「较新的那一个」直接渲染
  //    内联快照 = 页面自带，任何网络都能立刻出首屏（防止因加载慢丢客户）
  //    本地缓存 = 上次从 Supabase 拉到的最新版本（若比快照新就用它，避免闪一下旧数据）
  //    渲染完立刻在后台静默向 Supabase 拉最新，有新版本再无感替换
  const snap = (window.__CAT__ && (window.__CAT__.categories||[]).length) ? window.__CAT__ : null;
  const cached = readCatCache();
  let boot = null;
  if(snap && cached){
    const ts = d => Date.parse((d && d.updatedAt)||0)||0;
    boot = ts(cached) > ts(snap) ? cached : snap;
  }else{
    boot = snap || cached;
  }
  if(boot){
    DB = boot; applyDB(); hardLockFee(); render();   // 每次打开都锁定
    bgRefresh();
    return;
  }

  // 2) Supabase 是权威数据源（后台改完就写在那里）→ 必须优先；
  //    catalog.json 只在 Supabase 不可达时兜底。
  //    注意：不能再「谁先到用谁」——那样本地的旧文件会盖掉线上最新数据，
  //    表现就是「打开的不是最新版本、更新日期不是最新的」。
  const timer = setTimeout(showLoadTimeout, 12000);
  try{
    let d = await loadSb().catch(()=>null);                       // 权威源（内部 8s 超时）
    if(!d) d = await fetchJsonTimeout(API, 8000).catch(()=>null);  // 兜底：本地 catalog.json
    if(d && (d.categories||[]).length){
      clearTimeout(timer);
      DB = d; writeCatCache(d);
      applyDB(); hardLockFee(); render();   // 每次打开都锁定
      return;
    }
  }catch(e){}
  clearTimeout(timer);
  showLoadTimeout();
}

function matchP(p){

  return [p.name,p.insurer,p.highlight,p.premium,p.scene,p.note,p.company,p.area,p.notice,p.feature]
    .join(' ').toLowerCase().indexOf(k) >= 0;

/* 图片加载占位：加载完淡入显示，失败则提示 */
function bindImages(){
  document.querySelectorAll('.prod-img').forEach(box=>{
    const img = box.querySelector('img');
    if(!img || img.dataset.bound) return;
    img.dataset.bound = '1';
    const done = ()=>box.classList.remove('loading');
    if(img.complete && img.naturalWidth){ done(); return; }
    img.addEventListener('load', done);
    img.addEventListener('error', ()=>{
      box.classList.remove('loading');
      box.classList.add('err');
      const s = box.querySelector('.ph span');

function renderHome(){

function renderCat(c){

                ';--c-sub:'+(col.sub||'#2a4f76');

       '<div><h2>'+esc(c.name)+'</h2><p>'+esc(c.tagline||'')+' · 共 '+c.products.length+' 款产品</p></div></div>';

function field(k, v){
  if(!v) return '';
  return '<div class="field"><span class="k">'+esc(k)+'</span><span class="v">'+esc(F(v))+'</span></div>';
}

function renderProd(p, c){
  const col = c.color || {};
  const style = '--c-dark:'+(col.dark||'#1d4d8a')+';--c-light:'+(col.light||'#dbe6f4')+
                ';--c-sub:'+(col.sub||'#2a4f76');
  let h = '<article class="prod-card" style="'+style+'">';
  if(p.image){
    // 卡片用轻量图（快）；点开时换成高清图（清晰）——高清图不点不下载
    const fullAttr = (p.imageFull && p.imageFull !== p.image) ? ' data-full="'+esc(p.imageFull)+'"' : '';
    h += '<div class="prod-img loading"><div class="ph"><i></i><span>图片加载中…</span></div>'+
         '<img src="'+esc(p.image)+'"'+fullAttr+' alt="'+esc(F(p.name||'产品图'))+'" loading="lazy" decoding="async" title="点击放大查看"></div>';
  }
  // 投保链接行：支持 QR 二维码 + URL，都为空则降级提示联系管理员
  const hasLink = !!(p.insureLink && p.insureLink.trim());
  const hasQR = !!(p.insureQR && p.insureQR.trim());
  if(hasLink || hasQR){
    h += '<div class="insure-row">';
    if(hasQR) h += '<img class="qr-img" src="'+esc(p.insureQR)+'" alt="投保二维码">';
    h += '<div class="qr-text">';
    if(hasQR) h += '<span class="lab">扫码投保</span>';
    if(hasLink) h += '<a class="insure-btn" href="'+esc(p.insureLink)+'" target="_blank" rel="noopener noreferrer">📲 立即投保</a>';
    else if(hasQR) h += '<span class="hint">或保存图片→微信扫码</span>';
    h += '</div></div>';
  }else{
    h += '<div class="insure-row empty">投保请联系<b>管理员</b>获取链接</div>';
  }
  h += '<div class="prod-body">';
  // 产品名只显示一行（蓝色 chip）；自动截掉末尾的「数字%」形式（已有独立的 feeChannel/feeAgent/feeClient 字段，不需要在名称里重复显示费率）
  const rawIns = p.insurer || p.company || p.name || '';
  const ins = String(rawIns).replace(/\s*\d+(?:\.\d+)?\s*%$/, '').trim();
  // 费率（解锁后）直接排在产品名/公司同一排的后面；不显示「渠道/业务员/客户」字眼
  const feeVals = [];
  if(FEE_ON){
    const rowVis = f => FEE_AUDIENCE==='both' || FEE_AUDIENCE===f;
    if(rowVis('channel')){ const v = feeVal(p,'channel'); if(v) feeVals.push(v); }
    if(rowVis('agent'))  { const v = feeVal(p,'agent');   if(v) feeVals.push(v); }
    if(rowVis('client')) { const v = feeVal(p,'client');  if(v) feeVals.push(v); }
  }
  if(ins || feeVals.length){
    h += '<div class="name-row">';
    if(ins) h += '<span class="insurer">'+esc(ins)+'</span>';
    if(feeVals.length) h += '<span class="fee-inline">'+esc(F(feeVals.join(' · ')))+'</span>';
    h += '</div>';
  }
  if(p.premium) h += '<div class="fee">💰 参考保费：'+esc(F(p.premium))+'</div>';
  if(p.highlight) h += '<div class="hl">'+esc(F(p.highlight))+'</div>';
  if(p.feature) h += field('产品特色', p.feature);
  if(p.scene) h += field('适用场景', p.scene);
  if(p.area) h += field('销售区域', p.area);
  if(p.notice) h += '<div class="notice">📋 投保须知：'+esc(F(p.notice))+'</div>';
  if(p.note) h += '<div class="note">备注：'+esc(F(p.note))+'</div>';
  h += '</div></article>';
  return h;
}

async function doFeeOk(){

  const msg=document.getElementById('feeMsg');
  const okBtn=document.getElementById('feeOk');
  if(!v){ msg.textContent='请输入密码'; return; }
  let aud = await validCode(v);
  let netFail=false;
  if(!aud){
    // 本地缓存可能过期（后台刚生成了新密码）：拉一次线上最新数据重试（有 8 秒硬超时，不会一直卡）
    msg.textContent='正在验证…';

      const fresh = await loadSb();
      if(fresh){ DB = fresh; writeCatCache(fresh); applyDB(); aud = await validCode(v); }
      else netFail = true;
    }catch(e){ netFail = true; }
    if(okBtn){ okBtn.disabled=false; okBtn.style.opacity=''; }
  }
  if(aud){
    await unlockFee(v);      // 若费率已加密，这里用密码解出明文（未加密时是空操作）
    FEE_CODE = v;            // 仅本次页面会话有效，不落盘
    FEE_ON = true;

    feeSw.classList.remove('pending');

    render();
  }else{
    msg.textContent = netFail ? '网络较慢，没能连上云端校验，请稍后重试' : '密码无效或已失效，请联系管理员';
    document.getElementById('feeInput').value='';
    document.getElementById('feeInput').focus();
  }
}

document.getElementById('refreshBtn').onclick = async () => {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spin'); btn.disabled = true;
  try {
    const next = await loadSb();
    if (next) {
      writeCatCache(next);
      const before = JSON.stringify(DB);
      DB = next; applyDB(); revalidateFee(); render();
      if (before !== JSON.stringify(next)) {
        showUpdateToast('已刷新到最新 · v' + (next.updatedAt||'').slice(0,16).replace('T',' '));
      } else {
        showUpdateToast('已是最新 · v' + (next.updatedAt||'').slice(0,16).replace('T',' '));
      }
    } else {
      showUpdateToast('未拉到云端数据');
    }
  } catch(e) {
    showUpdateToast('刷新失败：'+e.message);
  } finally {
    setTimeout(()=>{ btn.classList.remove('spin'); btn.disabled = false; }, 600);
  }
};
</script>
</body>
</html>
