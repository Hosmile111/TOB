<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- WB_CACHE: v2026-09-12-0815 — Supabase改为权威数据源(不再"谁先到用谁"导致旧版本)、返回目录移到费率开关后、点图放大；内嵌图外置 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>非车险产品浏览目录</title>
<link rel="preconnect" href="https://hrwezjngocxtlfsprmwk.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://hosmile111.github.io">
<style>
:root{--bg:#f3f5f8;--line:#e2e7ee;--txt:#1b2430;--muted:#6b7a8d;--card:#fff;
--shadow:0 1px 2px rgba(16,32,64,.05),0 6px 18px rgba(16,32,64,.06)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}

header.site{background:var(--bg)}
.title-bar{background:linear-gradient(180deg,#1d4d8a,#1a4680);color:#fff;text-align:center;padding:18px 20px 14px}
.title-bar h1{margin:0 0 4px;font-size:24px;letter-spacing:2px;font-weight:800}
.title-bar p{margin:0;font-size:13px;opacity:.92;letter-spacing:.5px}
/* 只有这一行吸顶：搜索 + 更新日期 + 刷新 + 费率开关 同一排 */
.toolbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.toolbar-inner{display:flex;align-items:center;gap:10px;max-width:1240px;margin:0 auto;padding:9px 16px}
.toolbar .spacer{flex:1}
.toolbar input{border:1px solid var(--line);border-radius:10px;padding:11px 15px;font-size:15px;outline:none;min-width:240px;flex:1;max-width:480px}
.toolbar input:focus{border-color:#1d4d8a;box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.toolbar a{color:var(--muted);font-size:13px;text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:9px;white-space:nowrap}
.toolbar a:hover{border-color:#1d4d8a;color:#1d4d8a}
.updated{font-size:11.5px;color:#93a1b3;white-space:nowrap;margin-left:auto}
/* 顶栏「返回目录」（在费率开关后面） */
.toolbar-inner .back-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.toolbar-inner .back-btn:hover{border-color:#1d4d8a;color:#1d4d8a}
/* 点图放大 */
.imgbox-mask{position:fixed;inset:0;background:rgba(10,16,26,.9);z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px;cursor:zoom-out}
.imgbox-mask img{max-width:100%;max-height:calc(100% - 34px);object-fit:contain;border-radius:8px;background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.imgbox-mask .imgbox-tip{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#c9d4e2;font-size:12px;letter-spacing:.5px}

.wrap{max-width:1240px;margin:0 auto;padding:22px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .cat-hd{padding:10px 12px;font-size:16px;letter-spacing:1px}.cat-hd .emo{font-size:18px}
  .cat-sub{font-size:12px;padding:6px 8px}.cat-count,.cat-link{font-size:12px;padding:6px 8px}
  .title-bar h1{font-size:20px}.toolbar-inner{padding:8px 12px;gap:8px;flex-wrap:wrap}.toolbar input{min-width:0;max-width:none;flex:1 1 100%;font-size:15px;padding:10px 14px}.updated{margin-left:0;font-size:11.5px}}

.cat-card{background:var(--c-light);border:1.5px solid var(--c-dark);border-radius:4px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.cat-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.12)}
.cat-hd{background:var(--c-dark);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:1.5px}
.cat-hd .emo{font-size:22px;line-height:1}
.cat-sub{background:var(--c-light);color:var(--c-sub);text-align:center;padding:7px 10px;font-size:13.5px;border-bottom:1px solid #fff}
.cat-count{background:#fff;color:var(--c-acc);text-align:center;padding:8px 10px;font-size:14px;font-weight:600}
.cat-count b{font-size:15px;font-weight:800}
.cat-link{background:#fff;color:var(--c-link);text-align:center;padding:8px 10px;font-size:13px}

.detail-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.back{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer}
.back:hover{border-color:#1d4d8a;color:#1d4d8a}
.detail-hd{background:var(--c-dark);color:#fff;border-radius:6px;padding:18px 22px;margin-bottom:18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.detail-hd .emo{font-size:30px}
.detail-hd h2{margin:0 0 3px;font-size:21px;font-weight:800;letter-spacing:1px}
.detail-hd p{margin:0;font-size:13px;opacity:.9}

.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;align-items:start}
@media(max-width:900px){.prod-grid{grid-template-columns:1fr}}
.prod-card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.prod-card:hover{box-shadow:0 6px 18px rgba(0,0,0,.10);border-color:#c8d6ea}
/* 产品图：图框贴合图片自身比例（不再用固定宽度/4:3，彻底消除左右留白） */
.prod-img{position:relative;width:fit-content;max-width:100%;min-width:160px;min-height:120px;margin:10px auto 0;padding:6px;background:#f6f8fb;border:1px solid #e6ecf3;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.prod-img img{max-width:100%;max-height:380px;width:auto;height:auto;object-fit:contain;display:block;opacity:0;transition:opacity .25s;border-radius:6px;cursor:zoom-in}
.prod-img:not(.loading) img{opacity:1}
.prod-img .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#9aa7b8}
.prod-img .ph i{width:22px;height:22px;border:2px solid #d8e0ea;border-top-color:#1d4d8a;border-radius:50%;animation:fspin .8s linear infinite}
.prod-img:not(.loading) .ph{display:none}
.prod-img.err .ph i{display:none}
.prod-img.err .ph{color:#b82020}
@media(max-width:620px){.prod-img img{max-height:260px}}

/* 投保链接行：有链接/二维码才成块；无链接时仅一行细提示，不再占一条空框 */
.insure-row{margin:8px 12px 0;padding:7px 10px;background:#f6f9ff;border:1px solid #dfe8f4;border-radius:8px;display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;line-height:1.35}
.insure-row.empty{margin:6px 12px 0;padding:0;background:transparent;border:0;color:#9aa6b6;font-size:11.5px;line-height:1.5;justify-content:flex-start}
.insure-row.empty b{color:#5b7ba6;font-weight:600}
.insure-row .qr-img{width:52px;height:52px;border:1px solid #cfd9e6;border-radius:5px;object-fit:contain;background:#fff;padding:2px}
.insure-row .qr-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.insure-row .qr-text .lab{font-size:10.5px;color:#8a98ad;letter-spacing:.5px}
.insure-row .qr-text .hint{font-size:12px;color:#45546b}
.insure-row .insure-btn{display:inline-block;padding:6px 13px;background:var(--c-dark,#1d4d8a);color:#fff;font-size:12.5px;font-weight:600;border-radius:6px;text-decoration:none;white-space:nowrap}
.insure-row .insure-btn:hover{opacity:.92;transform:translateY(-1px);transition:all .15s}
@keyframes fspin{to{transform:rotate(360deg)}}
.prod-body{padding:12px 14px 14px;flex:1}
.prod-body h4{margin:0 0 8px;font-size:16px;font-weight:700;line-height:1.4}
.prod-body h4:empty{display:none}
.insurer{display:inline-block;background:var(--c-light,#eef2f8);color:var(--c-sub,#456);font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;margin-bottom:9px}
/* 产品名/公司 + 费率 同一排（费率解锁后才出现） */
.name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.name-row .insurer{margin-bottom:0}
.fee-inline{display:inline-flex;align-items:center;background:#e8f1ff;border:1px solid #cfe0f7;color:#1d4d8a;font-size:13px;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
.field{margin-bottom:7px;font-size:13px;line-height:1.65;display:flex;gap:7px}
.field .k{color:#8b98ab;flex-shrink:0;min-width:56px}
.field .v{color:#2b3745;flex:1;white-space:pre-wrap}
.fee{background:#f6f9ff;border:1px solid #dde7fb;border-radius:7px;padding:7px 11px;margin-bottom:9px;font-size:13px;color:#1d4d8a;font-weight:600}
.hl{background:#f8fafc;border-left:3px solid var(--c-dark,#1d4d8a);border-radius:0 6px 6px 0;padding:8px 11px;margin-bottom:9px;font-size:13px;line-height:1.7;color:#334254}
.notice{background:#fff8ec;border-left:3px solid #d99a2b;border-radius:0 6px 6px 0;padding:8px 11px;margin-top:9px;font-size:12.5px;line-height:1.7;color:#7a5a1a}
.note{background:#f6f8fa;border-radius:6px;padding:7px 11px;margin-top:8px;font-size:12.5px;line-height:1.65;color:#5a6b80}

.empty{text-align:center;padding:70px 20px;color:var(--muted);font-size:13.5px}
.loading{text-align:center;padding:70px 20px;color:var(--muted)}
.err{text-align:center;padding:70px 20px;color:#b82020}
.tip{margin-top:28px;background:#fff;border:1px dashed #d7e0ec;border-radius:10px;padding:13px 16px;font-size:12.5px;color:var(--muted);line-height:1.8}
.tip b{color:var(--txt)}

/* 刷新按钮 */
.refresh-btn{border:1px solid var(--line);background:#fff;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:transform .4s,color .2s,border-color .2s}
.refresh-btn:hover{border-color:#1d4d8a;color:#1d4d8a}
.refresh-btn.spin{transform:rotate(360deg)}
/* 手续费开关 */
.fee-sw{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px 4px 6px;cursor:pointer;font-size:12.5px;color:var(--muted);white-space:nowrap;transition:border-color .2s,color .2s}
.fee-sw:hover{border-color:#1d4d8a;color:#1d4d8a}
.fee-sw .knob{width:30px;height:18px;border-radius:10px;background:#c7d0dc;position:relative;transition:background .25s;flex-shrink:0}
.fee-sw .knob::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.fee-sw.pending .knob{background:#d99a2b}
.fee-sw.pending .knob::after{transform:translateX(12px)}
.fee-sw.on{border-color:#0f7b4f;color:#0f7b4f}
.fee-sw.on .knob{background:#0f7b4f}
.fee-sw.on .knob::after{transform:translateX(12px)}
/* 手续费密码弹窗 */
.fmask{position:fixed;inset:0;background:rgba(15,25,40,.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:18px}
.fbox{background:#fff;border-radius:14px;padding:24px;width:min(360px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.fbox h3{margin:0 0 6px;font-size:17px}
.fbox p{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.7}
.fbox input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;outline:none;letter-spacing:4px;text-align:center}
.fbox input:focus{border-color:#1d4d8a;box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.fbox .acts{display:flex;gap:8px;margin-top:16px}
.fbox .acts button{flex:1;border:1px solid var(--line);background:#fff;padding:10px;border-radius:8px;font-size:13px;cursor:pointer}
.fbox .acts button.pri{background:#1d4d8a;color:#fff;border-color:#1d4d8a;font-weight:700}
.fbox .msg{margin-top:10px;font-size:12.5px;min-height:18px;color:#b82020}
/* 以下 .fee2 / .fee-row 为「费率单独成块」的旧样式，现已改为 .name-row + .fee-inline（费率排在产品名后面同一排）；
   保留以备回退，当前渲染不再使用 */
.fee2{display:flex;gap:0 12px;margin-bottom:9px;padding:9px 12px;background:#f6f9ff;border:1px solid #dde7fb;border-radius:7px;font-size:13.5px;flex-wrap:wrap;align-items:center}
.fee2 .fee-row{display:inline-flex;align-items:center;font-weight:600;color:#1a3a5a;font-variant-numeric:tabular-nums;font-size:14px}
.fee2 .fee-row:not(.is-hidden):not(:last-child)::after{content:'·';color:#9bb0c8;margin-left:12px;font-weight:400;font-size:13px}
.fee2 .is-hidden{display:none}
@media(max-width:620px){.fee2{gap:6px 10px;padding:7px 10px;font-size:12.5px}.fee2 .fee-row{font-size:13px}}
@media print{.toolbar,.back{display:none!important}.cat-card,.prod-card{break-inside:avoid}.fee2{border-color:#888;background:transparent}}
</style>
</head>
<body>

<header class="site">
  <div class="title-bar">
    <h1>非车险产品浏览目录</h1>
    <p id="subtitle">点击卡片查看详情</p>
  </div>
</header>

<!-- 只有搜索这一行吸顶；大标题随页面滚走，节省屏幕空间 -->
<div class="toolbar">
  <div class="toolbar-inner">
    <input id="q" type="search" placeholder="搜索产品名称 / 保险公司 / 保障亮点…">
    <span class="updated" id="updated"></span>
    <button type="button" id="refreshBtn" class="refresh-btn" title="强制从云端刷新数据">🔄</button>
    <button type="button" id="feeSw" class="fee-sw" aria-pressed="false" title="输入密码后显示费率"><span class="knob"></span></button>
    <button type="button" id="backBtn" class="back-btn" style="display:none" title="返回目录">← 返回目录</button>
  </div>
</div>

<!-- 点图放大（保证压缩后的图片依然能看清内容） -->
<div id="imgBox" class="imgbox-mask" style="display:none" role="dialog" aria-label="查看大图">
  <img id="imgBoxImg" alt="产品图放大">
  <span class="imgbox-tip">点击任意处关闭</span>
</div>

<div id="feeMask" class="fmask" style="display:none">
  <div class="fbox">
    <h3>🔒 查看费率</h3>
    <p>请输入管理员提供的查看密码，验证后即可显示费率。<br>如无密码，请联系管理员获取。</p>
    <input id="feeInput" type="password" inputmode="numeric" maxlength="10" placeholder="••••" autocomplete="off">
    <div class="msg" id="feeMsg"></div>
    <div class="acts">
      <button id="feeCancel">取消</button>
      <button id="feeOk" class="pri">确定</button>
    </div>
  </div>
</div>

<div class="wrap" id="app"><div class="loading">正在加载产品数据…</div></div>

<script src="./supabase-config.js"></script>
<script>
const API = './catalog.json';
let DB = { categories: [] };
let view = { name: 'home' };
let KW = '';

function esc(s){const M={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'};
  return String(s==null?'':s).replace(/[&<>"]/g,c=>M[c]);}

function fmtTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const p = n => String(n).padStart(2,'0');
  // 只显示「月-日 时:分」（不显示年份，按用户要求）
  return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function applyDB(){
  document.getElementById('updated').textContent = DB.updatedAt ? ('更新于 '+fmtTime(DB.updatedAt)) : '';
  const n = (DB.categories||[]).length;
  document.getElementById('subtitle').textContent =
    '共 '+n+' 大类 · 点击卡片查看详情';
}

/* ===== 手续费开关：双手续费（业务员 / 客户），按密码组 audience 控制可见性 ===== */
let FEE_ON = false;
let FEE_AUDIENCE = 'none'; // 'agent'|'client'|'channel'|'both'|'none'
function passcodes(){ return (DB.viewPasscodes||[]).filter(x=>x && x.enabled && x.code); }
function maskRate(s){
  // 遮罩任意位置的「数字%」模式 —— 未授权访客应看不到任何费率数字
  return String(s==null?'':s).replace(/\d+(?:\.\d+)?\s*%/g, '**%');
}
function F(s){ return FEE_ON ? s : maskRate(s); }
// 校验密码并返回该组的 audience（'agent'/'client'/'both'），无效则 null
function validCode(code){
  if(!code) return null;
  const m = passcodes().find(x=>String(x.code)===String(code));
  return m ? (m.audience || 'both') : null;
}
// 抽取值：FEE_ON + audience 都允许才返回真实文本，否则空字符串（外层 row 用 is-hidden 占位）
function F2(field, s){
  if(s==null||s==='') return '';
  if(!FEE_ON) return '';
  if(FEE_AUDIENCE==='both' || FEE_AUDIENCE===field) return s;
  return '';
}
function syncFeeState(){
  const code = localStorage.getItem('fxy_fee_code')||'';
  const onFlag = localStorage.getItem('fxy_fee_on')==='1';
  const aud = code ? validCode(code) : null;
  if(!aud){
    if(code){ localStorage.removeItem('fxy_fee_code'); localStorage.setItem('fxy_fee_on','0'); }
    FEE_ON = false; FEE_AUDIENCE = 'none';
  }else{
    FEE_ON = onFlag;
    FEE_AUDIENCE = aud;
  }
  updateFeeSw();
}
function updateFeeSw(){
  const b=document.getElementById('feeSw');
  if(!b) return;
  b.classList.toggle('on', FEE_ON);
  b.setAttribute('aria-pressed', FEE_ON?'true':'false');
  // 按钮仅含 .knob 视觉元件，无文字标签；状态由 .on class + aria-pressed 体现
}
function sbCfg(){
  const c = Object.assign({}, (window.SUPABASE||{}));
  try{ const ls=JSON.parse(localStorage.getItem('fxy_supabase_cfg')||'{}'); if(ls && ls.url) Object.assign(c, ls); }catch(e){}
  if(c.url) c.url = String(c.url).replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,'');
  return c;
}
async function loadSb(){
  const c = sbCfg();
  if(!c.url || !c.key) return null;
  // 8 秒硬超时：Supabase 不可达/极慢时快速失败，不让页面与密码验证一直卡住
  const ac = new AbortController();
  const tm = setTimeout(()=>ac.abort(), 8000);
  try{
    const r = await fetch(c.url.replace(/\/+$/,'')+'/rest/v1/'+(c.table||'catalog')+'?select=data&id=eq.1',
      { headers:{ apikey:c.key, Authorization:'Bearer '+c.key }, signal:ac.signal });
    if(!r.ok) throw new Error('Supabase HTTP '+r.status);
    const j = await r.json();
    return (j && j[0] && j[0].data && (j[0].data.categories||[]).length) ? j[0].data : null;
  }finally{ clearTimeout(tm); }
}
function fetchJsonTimeout(url, ms){
  const ac = new AbortController();
  const tm = setTimeout(()=>ac.abort(), ms);
  return fetch(url, {cache:'no-store', signal:ac.signal})
    .then(r=>r.ok?r.json():null)
    .finally(()=>clearTimeout(tm));
}
/* 数据加载：localStorage 5 分钟缓存 + supabase/catalog 并发（谁先到用谁），8s 兜底超时 */
const CAT_CACHE_KEY='fxy_cat_cache', CAT_CACHE_TTL=1*60*1000;
function readCatCache(){
  try{
    const o = JSON.parse(localStorage.getItem(CAT_CACHE_KEY)||'{}');
    if(o && o._ts && Date.now()-o._ts < CAT_CACHE_TTL && o.data && (o.data.categories||[]).length) return o.data;
  }catch(e){}
  return null;
}
function writeCatCache(data){
  try{ localStorage.setItem(CAT_CACHE_KEY, JSON.stringify({_ts:Date.now(), data})); }catch(e){}
}
function bgRefresh(){
  // 立即拉一次 Supabase 最新数据（去掉 2.5 秒延迟），之后每 30 秒循环一次保持最新
  (async()=>{
    try{
      const next = await loadSb();
      if(next){
        writeCatCache(next);
        if(JSON.stringify(next) !== JSON.stringify(DB)){
          DB = next; applyDB(); syncFeeState(); render();
          try{ showUpdateToast('数据已更新 · v' + (next.updatedAt||'').slice(0,16).replace('T',' ')); }catch(e){}
        }
      }
    }catch(e){}
    setTimeout(bgRefresh, 30000);
  })();
}
function showUpdateToast(msg){
  let t=document.getElementById('updToast');
  if(!t){ t=document.createElement('div'); t.id='updToast'; t.style.cssText='position:fixed;bottom:18px;right:18px;background:#0f7b4f;color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:998;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;transition:opacity .25s'; document.body.appendChild(t); }
  t.textContent='✓ '+msg;
  t.style.opacity='1';
  clearTimeout(t._h); t._h=setTimeout(()=>{ t.style.opacity='0'; }, 2500);
}
function showLoadTimeout(){
  document.getElementById('app').innerHTML =
    '<div class="err">数据加载超时：云端数据源与本地 catalog.json 都不可达<br><br>'+
    '请检查网络后点下面的按钮重试。'+
    '<div style="margin-top:12px"><button id="retryLoad" style="padding:9px 22px;border:1px solid #b82020;background:#fff;color:#b82020;border-radius:8px;font-size:13.5px;cursor:pointer">重新加载</button></div></div>';
  const rb=document.getElementById('retryLoad');
  if(rb) rb.onclick=()=>{ try{ localStorage.removeItem(CAT_CACHE_KEY); }catch(e){} location.reload(); };
}
async function load(){
  if(window.__CAT__){ DB = window.__CAT__; applyDB(); syncFeeState(); render(); return; }

  // 1) 本地缓存秒开
  const cached = readCatCache();
  if(cached){
    DB = cached; applyDB(); syncFeeState(); render();
    bgRefresh();
    return;
  }

  // 2) Supabase 是权威数据源（后台改完就写在那里）→ 必须优先；
  //    catalog.json 只在 Supabase 不可达时兜底。
  //    注意：不能再「谁先到用谁」——那样本地的旧文件会盖掉线上最新数据，
  //    表现就是「打开的不是最新版本、更新日期不是最新的」。
  const timer = setTimeout(showLoadTimeout, 12000);
  try{
    let d = await loadSb().catch(()=>null);                       // 权威源（内部 8s 超时）
    if(!d) d = await fetchJsonTimeout(API, 8000).catch(()=>null);  // 兜底：本地 catalog.json
    if(d && (d.categories||[]).length){
      clearTimeout(timer);
      DB = d; writeCatCache(d);
      applyDB(); syncFeeState(); render();
      return;
    }
  }catch(e){}
  clearTimeout(timer);
  showLoadTimeout();
}

function matchP(p){
  if(!KW) return true;
  const k = KW.toLowerCase();
  return [p.name,p.insurer,p.highlight,p.premium,p.scene,p.note,p.company,p.area,p.notice,p.feature]
    .join(' ').toLowerCase().indexOf(k) >= 0;
}

function parseHash(){
  const h = (location.hash||'').replace(/^#\/?/,'').split('/');
  if(h[0]==='cat' && h[1]) return { name:'cat', id:h[1] };
  return { name:'home' };
}
window.addEventListener('hashchange', ()=>{ view=parseHash(); render(); window.scrollTo(0,0); });
function go(p){ location.hash = '#/'+p; }

function render(){
  const app = document.getElementById('app');
  // 「返回目录」放在顶栏费率开关后面，只在分类详情页出现
  const bb = document.getElementById('backBtn');
  if(bb) bb.style.display = (view.name==='cat') ? 'inline-flex' : 'none';
  if(view.name==='cat'){
    const c = DB.categories.find(x=>x.id===view.id);
    if(c){ app.innerHTML = renderCat(c); bindImages(); return; }
  }
  app.innerHTML = renderHome();
  bindImages();
}

/* 图片加载占位：加载完淡入显示，失败则提示 */
function bindImages(){
  document.querySelectorAll('.prod-img').forEach(box=>{
    const img = box.querySelector('img');
    if(!img || img.dataset.bound) return;
    img.dataset.bound = '1';
    const done = ()=>box.classList.remove('loading');
    if(img.complete && img.naturalWidth){ done(); return; }
    img.addEventListener('load', done);
    img.addEventListener('error', ()=>{
      box.classList.remove('loading');
      box.classList.add('err');
      const s = box.querySelector('.ph span');
      if(s) s.textContent = '图片加载失败';
    });
  });
}

function renderHome(){
  if(!DB.categories.length) return '<div class="empty">暂无产品数据</div>';
  let h = '<div class="grid">';
  DB.categories.forEach(c=>{
    const list = c.products.filter(matchP);
    if(KW && !list.length && !c.name.includes(KW)) return;
    const col = c.color || {};
    h += '<article class="cat-card" style="--c-dark:'+(col.dark||'#1d4d8a')+
         ';--c-light:'+(col.light||'#dbe6f4')+';--c-sub:'+(col.sub||'#2a4f76')+
         ';--c-acc:'+(col.acc||'#2a72c6')+';--c-link:'+(col.link||'#2a72c6')+
         '" data-cat="'+esc(c.id)+'">';
    h += '<div class="cat-hd">'+(c.emoji?'<span class="emo">'+esc(c.emoji)+'</span>':'')+'<span>'+esc(c.name)+'</span></div>';
    h += '<div class="cat-sub">'+esc(c.tagline||'')+'</div>';
    h += '<div class="cat-count">收录 <b>'+(KW?list.length:c.products.length)+'</b> 款产品</div>';
    h += '<div class="cat-link">🔍 点击查看详情 →</div>';
    h += '</article>';
  });
  h += '</div>';
  h += '<div class="tip"><b>说明：</b>保费与保障内容仅供参考，实际以保险公司核保报价为准。</div>';
  return h;
}

function renderCat(c){
  const col = c.color || {};
  const style = '--c-dark:'+(col.dark||'#1d4d8a')+';--c-light:'+(col.light||'#dbe6f4')+
                ';--c-sub:'+(col.sub||'#2a4f76');
  let h = '<div class="detail-hd" style="'+style+'">'+(c.emoji?'<span class="emo">'+esc(c.emoji)+'</span>':'')+
       '<div><h2>'+esc(c.name)+'</h2><p>'+esc(c.tagline||'')+' · 共 '+c.products.length+' 款产品</p></div></div>';

  const list = c.products.filter(matchP);
  if(!list.length){
    h += '<div class="empty">没有匹配「'+esc(KW)+'」的产品</div>';
    return h;
  }
  h += '<div class="prod-grid">';
  list.forEach(p=>{ h += renderProd(p, c); });
  h += '</div>';
  return h;
}

function field(k, v){
  if(!v) return '';
  return '<div class="field"><span class="k">'+esc(k)+'</span><span class="v">'+esc(F(v))+'</span></div>';
}

function renderProd(p, c){
  const col = c.color || {};
  const style = '--c-dark:'+(col.dark||'#1d4d8a')+';--c-light:'+(col.light||'#dbe6f4')+
                ';--c-sub:'+(col.sub||'#2a4f76');
  let h = '<article class="prod-card" style="'+style+'">';
  if(p.image){
    h += '<div class="prod-img loading"><div class="ph"><i></i><span>图片加载中…</span></div>'+
         '<img src="'+esc(p.image)+'" alt="'+esc(F(p.name||'产品图'))+'" loading="lazy" decoding="async" title="点击放大查看"></div>';
  }
  // 投保链接行：支持 QR 二维码 + URL，都为空则降级提示联系管理员
  const hasLink = !!(p.insureLink && p.insureLink.trim());
  const hasQR = !!(p.insureQR && p.insureQR.trim());
  if(hasLink || hasQR){
    h += '<div class="insure-row">';
    if(hasQR) h += '<img class="qr-img" src="'+esc(p.insureQR)+'" alt="投保二维码">';
    h += '<div class="qr-text">';
    if(hasQR) h += '<span class="lab">扫码投保</span>';
    if(hasLink) h += '<a class="insure-btn" href="'+esc(p.insureLink)+'" target="_blank" rel="noopener noreferrer">📲 立即投保</a>';
    else if(hasQR) h += '<span class="hint">或保存图片→微信扫码</span>';
    h += '</div></div>';
  }else{
    h += '<div class="insure-row empty">投保请联系<b>管理员</b>获取链接</div>';
  }
  h += '<div class="prod-body">';
  // 产品名只显示一行（蓝色 chip）；自动截掉末尾的「数字%」形式（已有独立的 feeChannel/feeAgent/feeClient 字段，不需要在名称里重复显示费率）
  const rawIns = p.insurer || p.company || p.name || '';
  const ins = String(rawIns).replace(/\s*\d+(?:\.\d+)?\s*%$/, '').trim();
  // 费率（解锁后）直接排在产品名/公司同一排的后面；不显示「渠道/业务员/客户」字眼
  const feeVals = [];
  if(FEE_ON){
    const rowVis = f => FEE_AUDIENCE==='both' || FEE_AUDIENCE===f;
    if(rowVis('channel') && p.feeChannel) feeVals.push(p.feeChannel);
    if(rowVis('agent')   && p.feeAgent)   feeVals.push(p.feeAgent);
    if(rowVis('client')  && p.feeClient)  feeVals.push(p.feeClient);
  }
  if(ins || feeVals.length){
    h += '<div class="name-row">';
    if(ins) h += '<span class="insurer">'+esc(ins)+'</span>';
    if(feeVals.length) h += '<span class="fee-inline">'+esc(F(feeVals.join(' · ')))+'</span>';
    h += '</div>';
  }
  if(p.premium) h += '<div class="fee">💰 参考保费：'+esc(F(p.premium))+'</div>';
  if(p.highlight) h += '<div class="hl">'+esc(F(p.highlight))+'</div>';
  if(p.feature) h += field('产品特色', p.feature);
  if(p.scene) h += field('适用场景', p.scene);
  if(p.area) h += field('销售区域', p.area);
  if(p.notice) h += '<div class="notice">📋 投保须知：'+esc(F(p.notice))+'</div>';
  if(p.note) h += '<div class="note">备注：'+esc(F(p.note))+'</div>';
  h += '</div></article>';
  return h;
}

document.addEventListener('click', e=>{
  // 点产品图 → 放大查看（保证压缩后内容依然看得清）
  const zoomImg = e.target.closest('.prod-img img');
  if(zoomImg){
    const box = document.getElementById('imgBox');
    if(box){ document.getElementById('imgBoxImg').src = zoomImg.currentSrc || zoomImg.src; box.style.display='flex'; }
    return;
  }
  // 点放大层任意处 → 关闭
  const box = document.getElementById('imgBox');
  if(box && box.style.display !== 'none'){ box.style.display='none'; return; }

  const card = e.target.closest('.cat-card');
  if(card){ go('cat/'+card.dataset.cat); return; }
  if(e.target.closest('[data-go="home"]')){ go('home'); return; }
});
document.getElementById('backBtn').onclick = () => go('home');

let timer;
document.getElementById('q').addEventListener('input', e=>{
  clearTimeout(timer);
  timer = setTimeout(()=>{ KW = e.target.value.trim(); render(); }, 200);
});

/* ===== 手续费开关交互：点击→右滑→输密码→变绿显示 ===== */
const feeSw = document.getElementById('feeSw');
feeSw.addEventListener('click', ()=>{
  if(FEE_ON){
    FEE_ON = false;
    localStorage.setItem('fxy_fee_on','0');
    updateFeeSw(); render(); return;
  }
  const saved = localStorage.getItem('fxy_fee_code')||'';
  if(saved && validCode(saved)){
    FEE_ON = true; localStorage.setItem('fxy_fee_on','1');
    updateFeeSw(); render(); return;
  }
  feeSw.classList.add('pending');
  document.getElementById('feeMsg').textContent='';
  document.getElementById('feeInput').value='';
  document.getElementById('feeMask').style.display='flex';
  setTimeout(()=>document.getElementById('feeInput').focus(),50);
});
function closeFeeMask(ok){
  document.getElementById('feeMask').style.display='none';
  if(!ok) feeSw.classList.remove('pending');
}
document.getElementById('feeCancel').onclick=()=>closeFeeMask(false);
document.getElementById('feeMask').addEventListener('click',e=>{ if(e.target.id==='feeMask') closeFeeMask(false); });
async function doFeeOk(){
  const v=(document.getElementById('feeInput').value||'').trim();
  const msg=document.getElementById('feeMsg');
  const okBtn=document.getElementById('feeOk');
  if(!v){ msg.textContent='请输入密码'; return; }
  let aud = validCode(v);
  let netFail=false;
  if(!aud){
    // 本地缓存可能过期（后台刚生成了新密码）：拉一次线上最新数据重试（有 8 秒硬超时，不会一直卡）
    msg.textContent='正在验证…';
    if(okBtn){ okBtn.disabled=true; okBtn.style.opacity='.6'; }
    try{
      const fresh = await loadSb();
      if(fresh){ DB = fresh; writeCatCache(fresh); applyDB(); aud = validCode(v); }
      else netFail = true;
    }catch(e){ netFail = true; }
    if(okBtn){ okBtn.disabled=false; okBtn.style.opacity=''; }
  }
  if(aud){
    localStorage.setItem('fxy_fee_code', v);
    localStorage.setItem('fxy_fee_on','1');
    FEE_ON = true;
    FEE_AUDIENCE = aud;
    feeSw.classList.remove('pending');
    updateFeeSw();
    document.getElementById('feeMask').style.display='none';
    render();
  }else{
    msg.textContent = netFail ? '网络较慢，没能连上云端校验，请稍后重试' : '密码无效或已失效，请联系管理员';
    document.getElementById('feeInput').value='';
    document.getElementById('feeInput').focus();
  }
}
document.getElementById('feeOk').onclick=doFeeOk;
document.getElementById('feeInput').addEventListener('keydown',e=>{ if(e.key==='Enter') doFeeOk(); });

view = parseHash();
load();
document.getElementById('refreshBtn').onclick = async () => {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spin'); btn.disabled = true;
  try {
    const next = await loadSb();
    if (next) {
      writeCatCache(next);
      const before = JSON.stringify(DB);
      DB = next; applyDB(); syncFeeState(); render();
      if (before !== JSON.stringify(next)) {
        showUpdateToast('已刷新到最新 · v' + (next.updatedAt||'').slice(0,16).replace('T',' '));
      } else {
        showUpdateToast('已是最新 · v' + (next.updatedAt||'').slice(0,16).replace('T',' '));
      }
    } else {
      showUpdateToast('未拉到云端数据');
    }
  } catch(e) {
    showUpdateToast('刷新失败：'+e.message);
  } finally {
    setTimeout(()=>{ btn.classList.remove('spin'); btn.disabled = false; }, 600);
  }
};
</script>
